# Nginx config for Product Research API
# Copy to: sudo cp deploy/oracle/nginx.conf /etc/nginx/sites-available/product_research
# Enable: sudo ln -sf /etc/nginx/sites-available/product_research /etc/nginx/sites-enabled/
#        sudo nginx -t && sudo systemctl reload nginx
# Update APP_PATH below if your project is not in /opt/product_research

server {
    listen 80;
    server_name _;  # Replace with your domain or VM IP

    client_max_body_size 50M;

    location /static/ {
        alias /opt/product_research/api/staticfiles/;  # Update path if needed
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        proxy_read_timeout 300;
    }
}
